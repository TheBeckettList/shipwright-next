# Local Bedrock test server that runs the packs straight from this project.
# Host networking lets the LAN broadcast reach your Wi-Fi so the Switch sees it
# under Friends > LAN Games (turn on in Docker Desktop: Settings > Resources > Network).
# platform linux/amd64 runs the official x86 server through Rosetta on Apple Silicon
# (Docker Desktop: Settings > General > "Use Rosetta for x86_64/amd64 emulation").
services:
  bds:
    image: itzg/minecraft-bedrock-server
    platform: linux/amd64
    container_name: waterworld-dev
    network_mode: host
    restart: "no"
    environment:
      EULA: "TRUE"
      VERSION: "${BDS_VERSION:-LATEST}"   # BDS_VERSION=1.26.62.1 bash dev/fresh.sh pins a version
      SERVER_NAME: "Waterworld Dev"
      LEVEL_NAME: "Waterworld Dev"
      LEVEL_TYPE: "FLAT"     # the overworld is only the door: everyone is taken to the sea world
      LEVEL_SEED: ""          # leave empty for random, or paste a seed you like
      GAMEMODE: "creative"
      ALLOW_CHEATS: "true"
      DEFAULT_PLAYER_PERMISSION_LEVEL: "operator"
      TEXTUREPACK_REQUIRED: "true"
      ONLINE_MODE: "true"
      ALLOW_LIST: "false"
      TRANSPORT: "nethernet"
      CONTENT_LOG_CONSOLE_OUTPUT_ENABLED: "true"
      SERVER_PORT: "19132"
      SERVER_PORT_V6: "19133"
      ENABLE_LAN_VISIBILITY: "true"
    volumes:
      - ./data:/data
      - ../BP:/data/behavior_packs/Waterworld_BP
      - ../RP:/data/resource_packs/Waterworld_RP
    stdin_open: true
    tty: true
